# Tests del backend: docker compose -f docker-compose.test.yml run --rm --build tests
name: goshuincho-test

services:
  tests:
    build:
      context: .
      target: test
    environment:
      SECRET_KEY: test
      DB_HOST: db
      DB_PASSWORD: test
      PUBLIC_URL: http://localhost:8000
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: ${POSTGIS_IMAGE:-postgis/postgis:16-3.4}
    environment:
      POSTGRES_DB: goshuin
      POSTGRES_USER: goshuin
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goshuin -d goshuin"]
      interval: 2s
      retries: 30
